[project]
name = "ingresso-adversarial"
version = "0.1.0"
description = "Protótipo do sistema adversarial de venda de ingressos (Trabalho 2)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno==3.2.1",
    "pydantic>=2.14.4",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
