# Parâmetros iniciais do protótipo (D4). Os valores são ilustrativos, como no T1.
# Tempo em ticks: 1 tick = 1 segundo simulado.

[simulacao]
semente = 42
rodadas = 5
duracao_abertura = 1800   # 30 minutos de venda por rodada
compradores_a1 = 60
contas_a2_max = 10

[lote]
quantidade = 100
premium = 20              # os 20 primeiros ingressos são premium
preco_premium = 500.0
preco_pista = 200.0

# População A1 (#9): compradores legítimos, sem estratégia, sorteados pela semente.
[populacao_a1]
fracao_sem_cartao = 0.15        # parte sem cartão (relevante para R3)
fracao_ansiosa = 0.2            # parte "ansiosa", com cadência alta (falso positivo, P3)
cadencia_normal = 5             # ticks entre duas ações de um comprador comum
cadencia_ansiosa = 1            # o ansioso age a cada tick
chegada_max = 120               # cada um chega entre o tick 0 e o 120
pagar_min = 30                  # tempo para pagar, sorteado nesta faixa;
pagar_max = 900                 # quem passa do TTL (600) perde a reserva: "prazo curto"
ingressos_min = 1
ingressos_max = 2
preferencia_premium = 0.5
tentativas_antes_da_fila = 3    # depois de 3 "indisponível", vai para a fila (ou desiste)
aceita_oferta = 0.85
desistencia_fila = 0.3          # desiste em vez de entrar na fila
desistencia_prazo = 0.5         # desiste quando a reserva expira antes de pagar
desistencia_verificacao = 0.7   # desiste quando a pré-autorização (R3) recusa

# Política com que A3 começa (D5, estado inicial do 3.3):
# 4 ingressos por conta, TTL de 10 minutos e nenhum controle ligado.
# Os outros números só valem quando A3 ligar o controle.
[politica_inicial]
limite_por_conta = 4
ttl = 600

[politica_inicial.limite_requisicoes]
ativo = false
maximo = 30
janela = 60
por = "origem"

[politica_inicial.r1]
ativo = false
prazo_oferta = 120

[politica_inicial.r2]
ativo = false
max_por_conta = 1
max_por_cluster = 1

[politica_inicial.r3]
ativo = false
custo = 10.0

[politica_inicial.r4]
ativo = false
prorrogacao = 300

[politica_inicial.r5]
ativo = false
limiar_expiracoes = 2

[politica_inicial.r6]
ativo = false
